name: Daily News Screener

on:
  schedule:
    # GitHub Actions cron er alltid UTC og flytter seg ikke med sommertid,
    # OG planlagte jobber starter ofte langt etter oppsatt tid (målt 22-103
    # minutter forsinkelse 10.08.2026). scripts/schedule_guard.py håndterer
    # begge deler: den ser på hvilket døgnvindu vi er i, ikke hvor nær et
    # klokkeslett vi er, og hopper over hvis vinduet alt har publisert.
    # Oppføringene under er derfor gjentatte forsøk, ikke eksakte tidspunkt.
    - cron: '30 5 * * *'   # 07:30 lokal i sommertid (CEST, UTC+2)
    - cron: '30 6 * * *'   # 07:30 lokal i vintertid (CET, UTC+1)
    - cron: '30 8 * * *'   # reserve hvis morgenkjøringene faller bort
    - cron: '30 15 * * *'  # 17:30 lokal i sommertid (CEST, UTC+2)
    - cron: '30 16 * * *'  # 17:30 lokal i vintertid (CET, UTC+1)
    - cron: '30 18 * * *'  # reserve hvis kveldskjøringene faller bort
  workflow_dispatch:
    inputs:
      run_type:
        description: 'Tving kjøretype (tomt = automatisk basert på klokkeslett)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - morning
          - evening

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vaktpost – bestem kjøretype eller avbryt
        id: guard
        env:
          FORCE_RUN_TYPE: ${{ github.event.inputs.run_type }}
        run: python scripts/schedule_guard.py

      - name: Kjør nyhetsskript
        if: steps.guard.outputs.proceed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          RUN_TYPE: ${{ steps.guard.outputs.run_type }}
        run: python generate_dashboard.py

      - name: Publisér endringer
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -d data/state ]; then git add data/state/; fi
          git commit -m "Oppdatert nyhetsdashboard (${{ steps.guard.outputs.run_type }})" || exit 0
          git push

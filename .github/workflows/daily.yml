name: Daily News Screener

on:
  schedule:
    # Kjører hver dag kl. 06:00 UTC (kl. 07:00 / 08:00 norsk tid)
    - cron: '0 6 * * *'
  workflow_dispatch: # Gjør at du også kan starte den manuelt med en knapp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Sjekk ut koden
        uses: actions/checkout@v3

      - name: Sett opp Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kjør nyhetsskript
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_dashboard.py

      - name: Publisér endringer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Oppdatert nyhetsdashboard" || exit 0
          git push
